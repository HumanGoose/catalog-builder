services:

  # ── Message broker ───────────────────────────────────────────────────────────
  # Redis acts as the "post office" between the API and Celery workers.
  # The API puts tasks in Redis; workers pull them out and execute them.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  # Handles HTTP requests: image uploads, status queries, slide edits, PPT export.
  # Also manages the WebSocket connection for real-time frontend updates.
  api:
    build: ./backend
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  # ── Celery worker ─────────────────────────────────────────────────────────────
  # Runs the actual pipeline tasks: classify → extract → process → assign.
  # Same codebase as the API, different entrypoint command.
  # Scale horizontally with: docker compose up --scale worker=3
  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  # ── Flower (Celery monitoring UI) ─────────────────────────────────────────────
  # Visual dashboard at localhost:5555 — shows task queues, worker status,
  # task history, and retry counts. This is the "observable pipeline" the
  # job spec explicitly calls out.
  flower:
    build: ./backend
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  # ── React frontend ────────────────────────────────────────────────────────────
  # Upload zone, live canvas, pipeline status sidebar, slide editor.
  # The anonymous volume on /app/node_modules prevents the host mount
  # from wiping the packages that were installed during image build.
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
