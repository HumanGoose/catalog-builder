services:

  # ── Message broker ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build: ./backend
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env

  # ── Celery worker: I/O-bound tasks (classify, group, extract) ─────────────────
  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --pool=gevent --concurrency=20 --queues=celery
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env

  # ── Celery worker: CPU-bound image processing ─────────────────────────────────
  # Uses prefork (multiprocessing) so Pillow's LANCZOS resize runs truly in
  # parallel — gevent can't parallelize CPU-bound C code.
  worker-process:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --pool=prefork --concurrency=4 --queues=processing
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env

  # ── Flower (Celery monitoring UI) ─────────────────────────────────────────────
  flower:
    build: ./backend
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env

  # ── React frontend ────────────────────────────────────────────────────────────
  # Built at image build time (npm run build), served by nginx.
  # nginx proxies /api/* → backend and /ws → backend WebSocket.
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
