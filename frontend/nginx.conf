server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # React app — serve static files, fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls — strip /api prefix and forward to backend
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded and processed images served by the backend
    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
    }
    location /processed/ {
        proxy_pass http://api:8000/processed/;
    }
    location /logo-img/ {
        proxy_pass http://api:8000/logo-img/;
    }

    # WebSocket — needs special headers to upgrade the connection
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
